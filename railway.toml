[build]
builder = "NIXPACKS"
buildCommand = "npm install"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "alfalyzer-api"
type = "web"

[services.env]
NODE_ENV = "production"
EOF < /dev/null