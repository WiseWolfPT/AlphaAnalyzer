<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Alfalyzer - Portuguese Investors International Markets Platform</title>
    
    <!-- Performance Optimization: Preload critical resources -->
    <link rel="preload" href="/src/index.css" as="style" />
    <link rel="preload" href="/src/main.tsx" as="script" />
    
    <!-- DNS Prefetch for external services -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.finnhub.io" />
    <link rel="dns-prefetch" href="https://www.alphavantage.co" />
    
    <!-- Resource Hints for better performance -->
    <link rel="modulepreload" href="/src/lib/queryClient.ts" />
    <link rel="modulepreload" href="/src/contexts/simple-auth-offline.tsx" />
    
    <!-- Meta tags for PWA -->
    <meta name="theme-color" content="#84cc16" />
    <meta name="description" content="Professional stock analytics platform for Portuguese investors accessing USA and EU markets" />
    <meta name="keywords" content="stocks, investment, portugal, usa markets, eu markets, portfolio, analysis" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
