<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Alfalyzer - Portuguese Investors International Markets Platform</title>
    
    <!-- Meta tags for PWA -->
    <meta name="theme-color" content="#84cc16" />
    <meta name="description" content="Professional stock analytics platform for Portuguese investors accessing USA and EU markets" />
    <meta name="keywords" content="stocks, investment, portugal, usa markets, eu markets, portfolio, analysis" />
    <!-- API key loaded via import.meta.env.VITE_MARKET_DATA_API_KEY at runtime -->
    <!-- Fallback styles to prevent black screen -->
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #f5f5f5;
        color: #333;
      }
      
      body.dark {
        background-color: #151515;
        color: #e4e7eb;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading fallback */
      .alfalyzer-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: inherit;
      }
      
      .alfalyzer-loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #F4FA4E;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DF734YkB.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DYOgWAf3.css">
  </head>
  <body>
    <a href="#conteudo-principal" class="sr-only focus:not-sr-only">Saltar para conteúdo principal</a>
    <div aria-live="polite" class="sr-only" id="market-updates-live-region">A atualizar índices de mercado…</div>
    <div id="root">
      <!-- Fallback loading indicator -->
      <div class="alfalyzer-loading">
        <div class="alfalyzer-loading-spinner"></div>
      </div>
    </div>
  </body>
