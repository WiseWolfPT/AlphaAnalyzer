<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 Solution Test Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #999;
            font-size: 1.1rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .summary-card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.2s;
            border: 1px solid #333;
        }
        
        .summary-card:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }
        
        .summary-card h3 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .summary-card.success h3 { color: #10b981; }
        .summary-card.warning h3 { color: #f59e0b; }
        .summary-card.error h3 { color: #ef4444; }
        .summary-card.info h3 { color: #3b82f6; }
        
        .category {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        
        .category h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #3b82f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .test-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .test-item {
            background: #0a0a0a;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #222;
            transition: all 0.2s;
        }
        
        .test-item:hover {
            background: #111;
            border-color: #444;
        }
        
        .test-name {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .test-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-icon {
            font-size: 1.5rem;
        }
        
        .test-details {
            background: #050505;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #888;
            display: none;
        }
        
        .test-item.expanded .test-details {
            display: block;
        }
        
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .badge.pass { background: #10b98133; color: #10b981; }
        .badge.fail { background: #ef444433; color: #ef4444; }
        .badge.warning { background: #f59e0b33; color: #f59e0b; }
        
        .time-badge {
            background: #3b82f633;
            color: #3b82f6;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            transition: width 0.5s ease;
        }
        
        .recommendations {
            background: #1a1a1a;
            border: 1px solid #f59e0b;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
        }
        
        .recommendations h2 {
            color: #f59e0b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .recommendations ul {
            list-style: none;
            padding-left: 20px;
        }
        
        .recommendations li {
            margin-bottom: 10px;
            display: flex;
            align-items: start;
            gap: 10px;
        }
        
        .recommendations li::before {
            content: "💡";
            flex-shrink: 0;
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #10b98133;
            color: #10b981;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .chart-container {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid #333;
        }
        
        #responseTimeChart {
            max-width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>401 Solution Test Dashboard</h1>
                    <p class="subtitle">Validação completa da solução de autenticação</p>
                </div>
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span id="liveStatus">Ao vivo</span>
                </div>
            </div>
        </header>
        
        <div class="actions">
            <button onclick="runTests()">🚀 Executar Testes</button>
            <button onclick="exportReport()">📥 Exportar Relatório</button>
            <button onclick="refreshData()">🔄 Atualizar</button>
            <button onclick="clearResults()" style="background: #ef4444;">🗑️ Limpar</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>
        
        <div class="summary-grid" id="summaryGrid">
            <div class="summary-card success">
                <h3 id="passCount">0</h3>
                <p>Testes Aprovados</p>
            </div>
            <div class="summary-card warning">
                <h3 id="warningCount">0</h3>
                <p>Avisos</p>
            </div>
            <div class="summary-card error">
                <h3 id="failCount">0</h3>
                <p>Falhas</p>
            </div>
            <div class="summary-card info">
                <h3 id="totalTime">0s</h3>
                <p>Tempo Total</p>
            </div>
        </div>
        
        <div id="testCategories"></div>
        
        <div class="chart-container">
            <h2 style="color: #3b82f6; margin-bottom: 20px;">📊 Tempo de Resposta por Endpoint</h2>
            <canvas id="responseTimeChart"></canvas>
        </div>
        
        <div class="recommendations" id="recommendations" style="display: none;">
            <h2>💡 Recomendações</h2>
            <ul id="recommendationsList"></ul>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let testResults = {
            categories: [],
            summary: {
                total: 0,
                passed: 0,
                failed: 0,
                warnings: 0
            },
            startTime: null,
            endTime: null
        };
        
        let responseTimeChart = null;
        
        function runTests() {
            console.log('Iniciando testes...');
            
            // Simula execução de testes
            simulateTestExecution();
            
            // Em produção, faria uma chamada real:
            // fetch('/api/run-tests')
            //     .then(res => res.json())
            //     .then(data => updateDashboard(data));
        }
        
        function simulateTestExecution() {
            // Dados de exemplo para demonstração
            const mockResults = {
                categories: [
                    {
                        name: 'Variáveis de Ambiente',
                        tests: [
                            { name: 'Backend: ALPHA_VANTAGE_API_KEY', status: 'pass', message: 'Configurada', time: 10 },
                            { name: 'Backend: FINNHUB_API_KEY', status: 'pass', message: 'Configurada', time: 12 },
                            { name: 'Frontend: VITE_BACKEND_URL', status: 'pass', message: 'Configurada', time: 8 },
                            { name: 'Arquivo .env.local', status: 'pass', message: 'Encontrado', time: 5 }
                        ]
                    },
                    {
                        name: 'Headers de Autenticação',
                        tests: [
                            { name: 'Headers aceitos', status: 'pass', message: 'Backend aceitou headers', time: 145 },
                            { name: 'Rejeição de headers inválidos', status: 'pass', message: 'Corretamente rejeitado', time: 89 }
                        ]
                    },
                    {
                        name: 'Conectividade APIs',
                        tests: [
                            { name: 'Alpha Vantage', status: 'pass', message: 'Status 200', time: 456 },
                            { name: 'Finnhub', status: 'pass', message: 'Status 200', time: 234 },
                            { name: 'FMP', status: 'warning', message: 'Rate limit próximo', time: 678 },
                            { name: 'Twelve Data', status: 'pass', message: 'Status 200', time: 345 }
                        ]
                    },
                    {
                        name: 'Performance',
                        tests: [
                            { name: '/api/health', status: 'pass', message: 'Média: 45ms', time: 45 },
                            { name: '/api/stocks/AAPL/quote', status: 'pass', message: 'Média: 234ms', time: 234 },
                            { name: '/api/watchlists', status: 'warning', message: 'Média: 1567ms', time: 1567 },
                            { name: '/api/earnings/calendar', status: 'pass', message: 'Média: 789ms', time: 789 }
                        ]
                    }
                ]
            };
            
            // Simula progresso
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 10;
                updateProgress(progress);
                
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    updateDashboard(mockResults);
                }
            }, 200);
        }
        
        function updateProgress(percent) {
            document.getElementById('progressBar').style.width = percent + '%';
        }
        
        function updateDashboard(results) {
            testResults = results;
            
            // Calcula sumário
            let total = 0;
            let passed = 0;
            let failed = 0;
            let warnings = 0;
            let totalTime = 0;
            
            results.categories.forEach(category => {
                category.tests.forEach(test => {
                    total++;
                    if (test.status === 'pass') passed++;
                    else if (test.status === 'fail') failed++;
                    else if (test.status === 'warning') warnings++;
                    
                    totalTime += test.time || 0;
                });
            });
            
            // Atualiza cards de sumário
            document.getElementById('passCount').textContent = passed;
            document.getElementById('warningCount').textContent = warnings;
            document.getElementById('failCount').textContent = failed;
            document.getElementById('totalTime').textContent = (totalTime / 1000).toFixed(1) + 's';
            
            // Renderiza categorias
            renderCategories(results.categories);
            
            // Atualiza gráfico
            updateResponseTimeChart(results.categories);
            
            // Mostra recomendações se houver falhas
            if (failed > 0 || warnings > 0) {
                showRecommendations(results.categories);
            }
        }
        
        function renderCategories(categories) {
            const container = document.getElementById('testCategories');
            container.innerHTML = '';
            
            categories.forEach(category => {
                const categoryEl = document.createElement('div');
                categoryEl.className = 'category';
                
                const hasFailures = category.tests.some(t => t.status === 'fail');
                const hasWarnings = category.tests.some(t => t.status === 'warning');
                
                categoryEl.innerHTML = `
                    <h2>
                        ${hasFailures ? '❌' : hasWarnings ? '⚠️' : '✅'} 
                        ${category.name}
                    </h2>
                    <div class="test-list">
                        ${category.tests.map(test => renderTest(test)).join('')}
                    </div>
                `;
                
                container.appendChild(categoryEl);
            });
        }
        
        function renderTest(test) {
            const statusIcon = test.status === 'pass' ? '✅' : 
                              test.status === 'fail' ? '❌' : '⚠️';
            
            return `
                <div class="test-item" onclick="toggleDetails(this)">
                    <div class="test-name">
                        <span class="status-icon">${statusIcon}</span>
                        <span>${test.name}</span>
                    </div>
                    <div class="test-status">
                        <span class="badge ${test.status}">${test.message}</span>
                        ${test.time ? `<span class="badge time-badge">${test.time}ms</span>` : ''}
                    </div>
                    ${test.details ? `
                        <div class="test-details">
                            ${JSON.stringify(test.details, null, 2)}
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        function toggleDetails(element) {
            element.classList.toggle('expanded');
        }
        
        function updateResponseTimeChart(categories) {
            const ctx = document.getElementById('responseTimeChart').getContext('2d');
            
            const endpoints = [];
            const times = [];
            
            categories.forEach(category => {
                if (category.name === 'Performance' || category.name === 'Conectividade APIs') {
                    category.tests.forEach(test => {
                        if (test.time) {
                            endpoints.push(test.name);
                            times.push(test.time);
                        }
                    });
                }
            });
            
            if (responseTimeChart) {
                responseTimeChart.destroy();
            }
            
            responseTimeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: endpoints,
                    datasets: [{
                        label: 'Tempo de Resposta (ms)',
                        data: times,
                        backgroundColor: times.map(t => 
                            t < 500 ? '#10b98166' : 
                            t < 1000 ? '#f59e0b66' : '#ef444466'
                        ),
                        borderColor: times.map(t => 
                            t < 500 ? '#10b981' : 
                            t < 1000 ? '#f59e0b' : '#ef4444'
                        ),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: '#333'
                            },
                            ticks: {
                                color: '#999'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#999'
                            }
                        }
                    }
                }
            });
        }
        
        function showRecommendations(categories) {
            const recommendationsEl = document.getElementById('recommendations');
            const listEl = document.getElementById('recommendationsList');
            
            listEl.innerHTML = '';
            const recommendations = [];
            
            categories.forEach(category => {
                const failures = category.tests.filter(t => t.status === 'fail' || t.status === 'warning');
                
                if (failures.length > 0) {
                    if (category.name === 'Variáveis de Ambiente') {
                        recommendations.push('Configure as variáveis de ambiente faltantes no arquivo .env.local');
                    }
                    if (category.name === 'Headers de Autenticação') {
                        recommendations.push('Verifique se VERCEL_PROXY_AUTH_SECRET está configurado corretamente');
                    }
                    if (category.name === 'Conectividade APIs') {
                        recommendations.push('Verifique as chaves de API e considere implementar fallback entre providers');
                    }
                    if (category.name === 'Performance') {
                        recommendations.push('Otimize endpoints lentos implementando cache mais agressivo');
                    }
                }
            });
            
            recommendations.forEach(rec => {
                const li = document.createElement('li');
                li.textContent = rec;
                listEl.appendChild(li);
            });
            
            recommendationsEl.style.display = recommendations.length > 0 ? 'block' : 'none';
        }
        
        function exportReport() {
            const report = {
                timestamp: new Date().toISOString(),
                results: testResults,
                environment: {
                    userAgent: navigator.userAgent,
                    timestamp: Date.now()
                }
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `401-test-report-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function refreshData() {
            location.reload();
        }
        
        function clearResults() {
            if (confirm('Limpar todos os resultados?')) {
                document.getElementById('testCategories').innerHTML = '';
                document.getElementById('passCount').textContent = '0';
                document.getElementById('warningCount').textContent = '0';
                document.getElementById('failCount').textContent = '0';
                document.getElementById('totalTime').textContent = '0s';
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('recommendations').style.display = 'none';
                
                if (responseTimeChart) {
                    responseTimeChart.destroy();
                }
            }
        }
        
        // Auto-refresh a cada 30 segundos
        setInterval(() => {
            const liveStatus = document.getElementById('liveStatus');
            liveStatus.textContent = 'Atualizando...';
            setTimeout(() => {
                liveStatus.textContent = 'Ao vivo';
            }, 1000);
        }, 30000);
    </script>
</body>
</html>
