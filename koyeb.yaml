app:
  name: alphaanalyzer-backend
  
build:
  type: dockerfile
  dockerfile: Dockerfile
  
env:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "8000"
  
service:
  ports:
    - port: 8000
      protocol: http
  
  routes:
    - path: /
      port: 8000
  
  healthcheck:
    path: /api/health
    interval: 30
    timeout: 10
    
  resources:
    instance_type: free
    
  regions:
    - fra # Frankfurt
    
  autoscaling:
    min: 1
    max: 1