services:
  - type: web
    name: alfalyzer-backend
    runtime: node
    region: oregon # or frankfurt for EU
    plan: free
    buildCommand: npm install
    startCommand: node coolify-simple-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://alfalyzer.vercel.app,https://alfalyzerpro4.vercel.app
      # Add your API keys here in Render dashboard
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false