name: Test 401 Solution

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Roda a cada 6 horas
    - cron: '0 */6 * * *'

env:
  NODE_VERSION: '18'

jobs:
  test-environment:
    name: Test Environment Variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Check Environment Variables
        run: |
          echo "Checking required environment variables..."
          
          # Backend variables (should exist in GitHub Secrets)
          required_backend=(
            "ALPHA_VANTAGE_API_KEY"
            "FINNHUB_API_KEY"
            "FMP_API_KEY"
            "TWELVE_DATA_API_KEY"
            "SUPABASE_SERVICE_KEY"
            "VERCEL_PROXY_AUTH_SECRET"
          )
          
          missing=0
          for var in "${required_backend[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing: $var"
              missing=$((missing + 1))
            else
              echo "✅ Found: $var"
            fi
          done
          
          if [ $missing -gt 0 ]; then
            echo "⚠️  Missing $missing environment variables"
            exit 1
          fi
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_PROXY_AUTH_SECRET: ${{ secrets.VERCEL_PROXY_AUTH_SECRET }}

  test-build:
    name: Test Build Process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            client/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          
      - name: Check build output
        run: |
          if [ -d "client/dist" ]; then
            echo "✅ Build successful"
            ls -la client/dist
          else
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi

  test-api-connectivity:
    name: Test API Connectivity
    runs-on: ubuntu-latest
    needs: test-environment
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Start backend server
        run: |
          npm run server &
          sleep 10  # Wait for server to start
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_PROXY_AUTH_SECRET: ${{ secrets.VERCEL_PROXY_AUTH_SECRET }}
          
      - name: Test API endpoints
        run: |
          # Test health endpoint
          curl -f http://localhost:3001/api/health || exit 1
          
          # Test stock quote with auth
          curl -f -H "x-vercel-proxy-auth: ${{ secrets.VERCEL_PROXY_AUTH_SECRET }}" \
            http://localhost:3001/api/stocks/AAPL/quote || exit 1
            
          echo "✅ API tests passed"

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-environment, test-build]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium
          
      - name: Start application
        run: |
          npm run dev &
          npx wait-on http://localhost:5173
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_PROXY_AUTH_SECRET: ${{ secrets.VERCEL_PROXY_AUTH_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: http://localhost:3001
          
      - name: Run E2E tests
        run: npx playwright test tests/e2e/test-401-full-flow.spec.ts
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: |
          npm audit --audit-level=high
          
      - name: Check for exposed secrets
        run: |
          # Check for API keys in code
          if grep -r "sk_test_\|pk_test_\|ALPHA_VANTAGE_API_KEY\|FINNHUB_API_KEY" --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" .; then
            echo "❌ Found exposed secrets in code!"
            exit 1
          else
            echo "✅ No exposed secrets found"
          fi
          
      - name: Test CORS configuration
        run: |
          npm run server &
          sleep 10
          
          # Test CORS headers
          response=$(curl -s -I -X OPTIONS \
            -H "Origin: https://alfalyzer.vercel.app" \
            -H "Access-Control-Request-Method: GET" \
            http://localhost:3001/api/health)
            
          if echo "$response" | grep -q "access-control-allow-origin"; then
            echo "✅ CORS headers present"
          else
            echo "❌ CORS headers missing"
            exit 1
          fi
        env:
          VERCEL_PROXY_AUTH_SECRET: ${{ secrets.VERCEL_PROXY_AUTH_SECRET }}

  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run bundle size check
        run: |
          npm run build
          
          # Check bundle sizes
          max_size=2048  # 2MB max
          
          for file in client/dist/assets/*.js; do
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            size_kb=$((size / 1024))
            
            echo "File: $file - Size: ${size_kb}KB"
            
            if [ $size_kb -gt $max_size ]; then
              echo "❌ Bundle too large: ${size_kb}KB > ${max_size}KB"
              exit 1
            fi
          done
          
          echo "✅ All bundles within size limits"
          
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:5173
          uploadArtifacts: true
          temporaryPublicStorage: true

  integration-test:
    name: Full Integration Test
    runs-on: ubuntu-latest
    needs: [test-environment, test-build, test-api-connectivity]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run full validation suite
        run: |
          # Create test results directory
          mkdir -p test-results
          
          # Run the comprehensive test
          node tests/validation/test-401-solution.ts
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_PROXY_AUTH_SECRET: ${{ secrets.VERCEL_PROXY_AUTH_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: http://localhost:3001
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results/

  notify-status:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test-environment, test-build, test-api-connectivity, test-e2e, test-security, test-performance, integration-test]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.integration-test.result }}" == "success" ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed"
            exit 1
          fi
          
      - name: Create status badge
        if: success()
        run: |
          echo '{"schemaVersion": 1, "label": "401 Solution", "message": "passing", "color": "green"}' > status.json
          
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: status-badge
          path: status.json