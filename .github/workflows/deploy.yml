name: Deploy

on:
  # Deploy automático para staging no merge para develop
  push:
    branches: [ develop ]
  # Deploy manual para produção
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Pular testes antes do deploy'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  # Validação pré-deploy
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.skip_tests == 'false'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript check
        run: npm run check
      
      - name: Run tests
        run: npm test
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/public/index.html" ]; then
            echo "Build validation failed"
            exit 1
          fi

  # Deploy para Staging (automático)
  deploy-staging:
    name: Deploy to Staging
    needs: pre-deploy
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.alfalyzer.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for staging
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
      
      - name: Deploy to Vercel Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --env preview'
          alias-domains: staging.alfalyzer.com
      
      - name: Deploy backend to Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          npm install -g @railway/cli
          railway up --environment staging
      
      - name: Run smoke tests
        run: |
          npm run test:e2e -- --grep "@smoke"
        env:
          BASE_URL: https://staging.alfalyzer.com
      
      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployed to staging: https://staging.alfalyzer.com'
            })

  # Deploy para Produção (manual com aprovação)
  deploy-production:
    name: Deploy to Production
    needs: pre-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://alfalyzer.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_STRIPE_PUBLISHABLE_KEY }}
      
      - name: Create deployment backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "Creating backup: backup-$TIMESTAMP"
          echo $TIMESTAMP > .deployment-timestamp
      
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          alias-domains: |
            alfalyzer.com
            www.alfalyzer.com
      
      - name: Deploy backend to Railway Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          npm install -g @railway/cli
          railway up --environment production
      
      - name: Run production smoke tests
        id: smoke-tests
        run: |
          npm run test:e2e -- --grep "@smoke"
        env:
          BASE_URL: https://alfalyzer.com
        continue-on-error: true
      
      - name: Rollback on failure
        if: steps.smoke-tests.outcome == 'failure'
        run: |
          echo "Smoke tests failed! Initiating rollback..."
          # Implement rollback logic here
          exit 1
      
      - name: Invalidate CDN cache
        run: |
          # Cloudflare cache purge (if using Cloudflare)
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
      
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## 🚀 Production Deployment
            
            **Deployed by:** @${{ github.actor }}
            **Deployment URL:** ${{ steps.vercel-deploy.outputs.preview-url }}
            **Commit:** ${{ github.sha }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

  # Monitoramento pós-deploy
  post-deploy-monitoring:
    name: Post Deployment Monitoring
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
      - name: Check application health
        run: |
          ENVIRONMENT=${{ github.event_name == 'push' && 'staging' || github.event.inputs.environment }}
          if [ "$ENVIRONMENT" = "staging" ]; then
            URL="https://staging.alfalyzer.com"
          else
            URL="https://alfalyzer.com"
          fi
          
          echo "Checking health of $URL"
          
          # Check frontend
          curl -f -s -o /dev/null -w "%{http_code}" $URL || exit 1
          
          # Check API health
          curl -f -s -o /dev/null -w "%{http_code}" $URL/api/health || exit 1
          
          echo "Health checks passed!"
      
      - name: Monitor error rates
        run: |
          # Implement Sentry or other monitoring checks
          echo "Monitoring error rates for 5 minutes..."
          sleep 300
      
      - name: Performance check
        run: |
          # Run Lighthouse CI or similar
          echo "Running performance checks..."

  # Notificação final
  notify:
    name: Deployment Notification
    needs: [deploy-staging, deploy-production, post-deploy-monitoring]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment Status: ${{ job.status }}
            Environment: ${{ github.event_name == 'push' && 'staging' || github.event.inputs.environment }}
            Deployed by: ${{ github.actor }}
            Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: always()