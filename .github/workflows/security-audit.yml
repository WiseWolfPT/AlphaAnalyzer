name: Security Audit

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      audit_type:
        description: 'Type of security audit'
        required: false
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'dependencies'
          - 'secrets'
          - 'code'
  push:
    branches: [ main ]
    paths:
      - 'package*.json'
      - 'server/**'
      - '.github/workflows/**'

env:
  NODE_VERSION: '18'
  AUDIT_RESULTS_PATH: 'audit-results'

jobs:
  security-scan:
    name: Comprehensive Security Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities-found: ${{ steps.audit-summary.outputs.vulnerabilities-found }}
      critical-issues: ${{ steps.audit-summary.outputs.critical-issues }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create audit results directory
        run: mkdir -p ${{ env.AUDIT_RESULTS_PATH }}

      - name: NPM Security Audit
        run: |
          echo "🔍 Running NPM security audit..."
          npm audit --json > ${{ env.AUDIT_RESULTS_PATH }}/npm-audit.json || true
          npm audit > ${{ env.AUDIT_RESULTS_PATH }}/npm-audit.txt || true
          echo "NPM audit completed"

      - name: Dependency Vulnerability Check
        run: |
          echo "🔍 Checking for known vulnerable dependencies..."
          
          # Check for known vulnerable packages
          if npm audit --audit-level=high --dry-run; then
            echo "✅ No high-risk vulnerabilities found"
          else
            echo "⚠️ High-risk vulnerabilities detected"
            npm audit --audit-level=high > ${{ env.AUDIT_RESULTS_PATH }}/high-risk-vulns.txt
          fi

      - name: Secret Detection
        run: |
          echo "🔍 Scanning for exposed secrets..."
          
          # Check for various types of secrets
          secrets_found=false
          
          # API Keys
          if grep -r "sk_" --include="*.js" --include="*.ts" --include="*.json" . | grep -v node_modules | grep -v ".git" > ${{ env.AUDIT_RESULTS_PATH }}/potential-api-keys.txt; then
            echo "⚠️ Potential API keys found"
            secrets_found=true
          fi
          
          # Database URLs
          if grep -r "postgres://" --include="*.js" --include="*.ts" --include="*.json" . | grep -v node_modules | grep -v ".git" > ${{ env.AUDIT_RESULTS_PATH }}/potential-db-urls.txt; then
            echo "⚠️ Potential database URLs found"
            secrets_found=true
          fi
          
          # Private keys
          if grep -r "BEGIN.*PRIVATE.*KEY" --include="*.js" --include="*.ts" --include="*.json" --include="*.pem" . | grep -v node_modules | grep -v ".git" > ${{ env.AUDIT_RESULTS_PATH }}/potential-private-keys.txt; then
            echo "⚠️ Potential private keys found"
            secrets_found=true
          fi
          
          # AWS credentials
          if grep -r "AKIA[0-9A-Z]{16}" --include="*.js" --include="*.ts" --include="*.json" . | grep -v node_modules | grep -v ".git" > ${{ env.AUDIT_RESULTS_PATH }}/potential-aws-keys.txt; then
            echo "⚠️ Potential AWS keys found"
            secrets_found=true
          fi
          
          if [ "$secrets_found" = false ]; then
            echo "✅ No secrets detected in repository"
            echo "No secrets found" > ${{ env.AUDIT_RESULTS_PATH }}/secrets-scan.txt
          else
            echo "❌ Potential secrets detected - review required"
          fi

      - name: Code Security Analysis
        run: |
          echo "🔍 Running code security analysis..."
          
          # Check for dangerous functions
          echo "Checking for dangerous code patterns..."
          
          # SQL injection patterns
          if grep -r "query.*+.*req\." --include="*.js" --include="*.ts" server/ > ${{ env.AUDIT_RESULTS_PATH }}/sql-injection-risks.txt; then
            echo "⚠️ Potential SQL injection risks found"
          fi
          
          # XSS patterns
          if grep -r "innerHTML.*req\." --include="*.js" --include="*.ts" --include="*.tsx" . | grep -v node_modules > ${{ env.AUDIT_RESULTS_PATH }}/xss-risks.txt; then
            echo "⚠️ Potential XSS risks found"
          fi
          
          # Eval usage
          if grep -r "eval(" --include="*.js" --include="*.ts" . | grep -v node_modules > ${{ env.AUDIT_RESULTS_PATH }}/eval-usage.txt; then
            echo "⚠️ Eval usage detected"
          fi
          
          echo "Code security analysis completed"

      - name: Environment Security Check
        run: |
          echo "🔍 Checking environment security..."
          
          # Check for environment template
          if [ -f "setup-env.template" ]; then
            echo "✅ Environment template exists"
            
            # Check if template has secure examples
            if grep -q "your_api_key_here" setup-env.template; then
              echo "✅ Environment template uses placeholder values"
            else
              echo "⚠️ Environment template might contain real values"
            fi
          else
            echo "❌ Environment template missing"
          fi
          
          # Check for .env files in repository
          if find . -name ".env*" -not -path "./node_modules/*" -not -name "*.template" -not -name "*.example" > ${{ env.AUDIT_RESULTS_PATH }}/env-files.txt && [ -s ${{ env.AUDIT_RESULTS_PATH }}/env-files.txt ]; then
            echo "❌ Environment files found in repository"
          else
            echo "✅ No environment files found in repository"
          fi

      - name: CORS and Security Headers Check
        run: |
          echo "🔍 Checking security headers configuration..."
          
          # Check for CORS configuration
          if grep -r "cors" server/ > ${{ env.AUDIT_RESULTS_PATH }}/cors-config.txt; then
            echo "✅ CORS configuration found"
          else
            echo "⚠️ CORS configuration not found"
          fi
          
          # Check for security middleware
          if grep -r "helmet" server/ > ${{ env.AUDIT_RESULTS_PATH }}/security-headers.txt; then
            echo "✅ Security headers middleware found"
          else
            echo "⚠️ Security headers middleware not found"
          fi

      - name: Audit Summary
        id: audit-summary
        run: |
          echo "📊 Generating audit summary..."
          
          vulnerabilities_found=false
          critical_issues=false
          
          # Check npm audit results
          if [ -f "${{ env.AUDIT_RESULTS_PATH }}/npm-audit.json" ]; then
            critical_count=$(cat ${{ env.AUDIT_RESULTS_PATH }}/npm-audit.json | jq '.metadata.vulnerabilities.critical // 0')
            high_count=$(cat ${{ env.AUDIT_RESULTS_PATH }}/npm-audit.json | jq '.metadata.vulnerabilities.high // 0')
            
            if [ "$critical_count" -gt 0 ]; then
              echo "❌ Critical vulnerabilities found: $critical_count"
              critical_issues=true
              vulnerabilities_found=true
            fi
            
            if [ "$high_count" -gt 0 ]; then
              echo "⚠️ High vulnerabilities found: $high_count"
              vulnerabilities_found=true
            fi
          fi
          
          # Check for secrets
          if [ -f "${{ env.AUDIT_RESULTS_PATH }}/potential-api-keys.txt" ] && [ -s "${{ env.AUDIT_RESULTS_PATH }}/potential-api-keys.txt" ]; then
            echo "❌ Potential API keys detected"
            critical_issues=true
          fi
          
          echo "vulnerabilities-found=$vulnerabilities_found" >> $GITHUB_OUTPUT
          echo "critical-issues=$critical_issues" >> $GITHUB_OUTPUT

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: ${{ env.AUDIT_RESULTS_PATH }}/
          retention-days: 30

  cost-protection-audit:
    name: Cost Protection Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit cost protection mechanisms
        run: |
          echo "🔍 Auditing cost protection mechanisms..."
          
          # Check if cost protection scripts exist
          if [ -f "scripts/cost-protection-check.js" ]; then
            echo "✅ Cost protection check script exists"
          else
            echo "❌ Cost protection check script missing"
          fi
          
          if [ -f "server/middleware/cost-protection.ts" ]; then
            echo "✅ Cost protection middleware exists"
          else
            echo "❌ Cost protection middleware missing"
          fi
          
          # Validate cost protection integration
          if [ -f "scripts/validate-cost-protection.mjs" ]; then
            echo "✅ Cost protection validation script exists"
            node scripts/validate-cost-protection.mjs || echo "Cost protection validation failed"
          else
            echo "❌ Cost protection validation script missing"
          fi

  infrastructure-security:
    name: Infrastructure Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker security
        run: |
          echo "🔍 Checking Docker security..."
          
          if [ -f "Dockerfile" ]; then
            echo "✅ Dockerfile found"
            
            # Check for security best practices
            if grep -q "USER" Dockerfile; then
              echo "✅ Non-root user specified in Dockerfile"
            else
              echo "⚠️ Dockerfile runs as root"
            fi
            
            if grep -q "COPY --chown" Dockerfile; then
              echo "✅ Proper file ownership in Dockerfile"
            fi
          else
            echo "ℹ️ No Dockerfile found"
          fi

      - name: Check deployment configuration
        run: |
          echo "🔍 Checking deployment configuration..."
          
          if [ -f "vercel.json" ]; then
            echo "✅ Vercel configuration found"
            
            # Check for security headers
            if grep -q "headers" vercel.json; then
              echo "✅ Security headers configured"
            else
              echo "⚠️ No security headers configured"
            fi
          fi

  notification:
    name: Security Audit Notification
    runs-on: ubuntu-latest
    needs: [security-scan, cost-protection-audit, infrastructure-security]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "🔒 SECURITY AUDIT COMPLETED"
          echo "=========================="
          echo "Scan date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          
          if [ "${{ needs.security-scan.outputs.critical-issues }}" = "true" ]; then
            echo "❌ CRITICAL SECURITY ISSUES FOUND"
            echo "Immediate attention required"
          elif [ "${{ needs.security-scan.outputs.vulnerabilities-found }}" = "true" ]; then
            echo "⚠️ Security vulnerabilities detected"
            echo "Review recommended"
          else
            echo "✅ No critical security issues found"
          fi
          
          echo ""
          echo "Audit components:"
          echo "- Dependency scan: ${{ needs.security-scan.result }}"
          echo "- Cost protection: ${{ needs.cost-protection-audit.result }}"
          echo "- Infrastructure: ${{ needs.infrastructure-security.result }}"
          
          echo ""
          echo "Next scheduled audit: $(date -d '+1 day' -u '+%Y-%m-%d %H:%M:%S UTC')"