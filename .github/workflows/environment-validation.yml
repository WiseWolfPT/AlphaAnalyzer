name: 🌍 Environment Validation

on:
  # Run on deployment-related events
  push:
    branches: [main, develop]
    paths:
      - '.env*'
      - 'package.json'
      - 'server/config/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.env*'
      - 'package.json'
      - 'server/config/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to validate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - staging
          - production

# Restrict permissions for security
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: 18

jobs:
  # 🔍 Environment Configuration Validation
  validate-env-config:
    name: 🔍 Environment Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        environment: [staging, production]
        include:
          - environment: staging
            required_secrets: |
              STAGING_API_URL
              STAGING_SUPABASE_URL
              STAGING_SUPABASE_ANON_KEY
              STAGING_STRIPE_PUBLISHABLE_KEY
              VERCEL_TOKEN
              VERCEL_ORG_ID
              VERCEL_PROJECT_ID
              RAILWAY_TOKEN_STAGING
          - environment: production
            required_secrets: |
              PRODUCTION_API_URL
              PRODUCTION_SUPABASE_URL
              PRODUCTION_SUPABASE_ANON_KEY
              PRODUCTION_STRIPE_PUBLISHABLE_KEY
              VERCEL_TOKEN
              VERCEL_ORG_ID
              VERCEL_PROJECT_ID
              RAILWAY_TOKEN_PRODUCTION
              CLOUDFLARE_ZONE_ID
              CLOUDFLARE_API_TOKEN

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Validate environment configuration
        run: |
          echo "## 🌍 Environment Validation: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if environment validation script exists
          if [ -f "scripts/validate-environment.js" ]; then
            echo "Running environment validation script..."
            node scripts/validate-environment.js --env=${{ matrix.environment }}
          else
            echo "⚠️ Environment validation script not found, performing basic checks"
          fi
          
          # Basic validation for required environment variables
          echo "### Required Environment Variables" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Note: We can't check actual secret values, but we can validate the structure
          required_vars="${{ matrix.required_secrets }}"
          for var in $required_vars; do
            echo "| $var | ⚠️ Check in GitHub Secrets |" >> $GITHUB_STEP_SUMMARY
          done

      - name: 🧪 Test environment file structure
        run: |
          echo "Checking environment file structure..."
          
          # Check for .env.example or documentation
          if [ -f ".env.example" ] || [ -f "setup-env.template" ]; then
            echo "✅ Environment template found"
          else
            echo "⚠️ No environment template found (.env.example or setup-env.template)"
          fi
          
          # Check for environment validation
          if [ -f "server/config/env.ts" ]; then
            echo "✅ Environment configuration file found"
          else
            echo "⚠️ Environment configuration file not found"
          fi

      - name: 📋 Environment summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration validated" >> $GITHUB_STEP_SUMMARY
          echo "- Ready for deployment" >> $GITHUB_STEP_SUMMARY

  # 🔐 Security Configuration Check
  security-config:
    name: 🔐 Security Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for exposed secrets
        run: |
          echo "## 🔐 Security Configuration Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for accidentally committed secrets
          secret_patterns=(
            "SUPABASE_SERVICE_KEY"
            "STRIPE_SECRET_KEY"
            "OPENAI_API_KEY"
            "ALPHA_VANTAGE_API_KEY"
            "FINNHUB_API_KEY"
            "FMP_API_KEY"
            "TWELVE_DATA_API_KEY"
            "POLYGON_API_KEY"
          )
          
          found_secrets=false
          
          for pattern in "${secret_patterns[@]}"; do
            if grep -r "$pattern" --include="*.ts" --include="*.js" --include="*.tsx" --include="*.jsx" --exclude-dir=node_modules . | grep -v ".example" | grep -v "\.d\.ts" | grep -v "// " | grep -v "\* " | head -5; then
              echo "❌ Potential secret exposure found: $pattern" >> $GITHUB_STEP_SUMMARY
              found_secrets=true
            fi
          done
          
          if [ "$found_secrets" = false ]; then
            echo "✅ No exposed secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Review potential secret exposures above" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Validate VITE prefix usage
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Frontend Environment Variables" >> $GITHUB_STEP_SUMMARY
          
          # Check for proper VITE_ prefix usage
          if grep -r "VITE_" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules client/src/ | head -10; then
            echo "✅ VITE_ prefixed variables found (safe for frontend)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for improper environment variable usage in frontend
          if grep -r "process\.env\." --include="*.ts" --include="*.tsx" --exclude-dir=node_modules client/src/ | grep -v "VITE_" | head -5; then
            echo "⚠️ Non-VITE environment variables in frontend detected" >> $GITHUB_STEP_SUMMARY
            echo "These will be undefined in production builds" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Proper frontend environment variable usage" >> $GITHUB_STEP_SUMMARY
          fi

  # 📊 Configuration Completeness
  config-completeness:
    name: 📊 Configuration Completeness
    runs-on: ubuntu-latest
    needs: [validate-env-config, security-config]
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📊 Generate configuration report
        run: |
          echo "# 🌍 Environment Configuration Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check configuration files
          config_files=(
            "package.json:✅"
            "server/config/env.ts:✅"
            "client/src/lib/env.ts:✅"
            ".env.example:⚠️"
            "setup-env.template:✅"
            "vercel.json:✅"
            "railway.toml:⚠️"
          )
          
          echo "## 📁 Configuration Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for config in "${config_files[@]}"; do
            file=$(echo $config | cut -d: -f1)
            status=$(echo $config | cut -d: -f2)
            
            if [ -f "$file" ]; then
              echo "| $file | ✅ Found |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $file | $status Optional |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: 🎯 Environment readiness score
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Production Readiness Score" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          score=0
          max_score=10
          
          # Score calculation
          [ -f "server/config/env.ts" ] && score=$((score + 2))
          [ -f "client/src/lib/env.ts" ] && score=$((score + 1))
          [ -f "setup-env.template" ] && score=$((score + 1))
          [ -f "vercel.json" ] && score=$((score + 1))
          [ -f ".github/workflows/deploy.yml" ] && score=$((score + 2))
          [ -f "scripts/validate-environment.js" ] && score=$((score + 1))
          [ -f "docs/DEPLOYMENT_GUIDE.md" ] && score=$((score + 1))
          [ -f "client/src/lib/monitoring/sentry.ts" ] && score=$((score + 1))
          
          percentage=$((score * 100 / max_score))
          
          echo "**Score: $score/$max_score ($percentage%)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ $percentage -ge 80 ]; then
            echo "🎉 **EXCELLENT** - Ready for production deployment" >> $GITHUB_STEP_SUMMARY
          elif [ $percentage -ge 60 ]; then
            echo "✅ **GOOD** - Minor improvements recommended" >> $GITHUB_STEP_SUMMARY
          elif [ $percentage -ge 40 ]; then
            echo "⚠️ **NEEDS WORK** - Several configurations missing" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **NOT READY** - Major configuration issues" >> $GITHUB_STEP_SUMMARY
          fi

  # 💬 Environment Summary Comment
  environment-summary:
    name: 💬 Environment Summary
    runs-on: ubuntu-latest
    needs: [validate-env-config, security-config, config-completeness]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: 💬 Comment PR with environment status
        uses: actions/github-script@v7
        with:
          script: |
            const envStatus = '${{ needs.validate-env-config.result }}';
            const securityStatus = '${{ needs.security-config.result }}';
            const configStatus = '${{ needs.config-completeness.result }}';
            
            const getIcon = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                case 'skipped': return '⏭️';
                default: return '❓';
              }
            };
            
            const allPassed = [envStatus, securityStatus, configStatus].every(s => s === 'success');
            
            const comment = `## 🌍 Environment Configuration Status
            
            | Check | Status |
            |-------|--------|
            | 🔍 Environment Validation | ${getIcon(envStatus)} ${envStatus} |
            | 🔐 Security Configuration | ${getIcon(securityStatus)} ${securityStatus} |
            | 📊 Configuration Completeness | ${getIcon(configStatus)} ${configStatus} |
            
            ${allPassed ? 
              '## ✅ Environment configuration is ready for deployment!' : 
              '## ⚠️ Environment configuration needs attention before deployment.'
            }
            
            ### 📋 Deployment Checklist
            - [ ] All required secrets configured in GitHub
            - [ ] Environment variables validated
            - [ ] Security checks passed
            - [ ] Configuration files present
            
            🔗 [View detailed results](${context.payload.pull_request.html_url}/checks)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })