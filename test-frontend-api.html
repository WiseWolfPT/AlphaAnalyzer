<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend API</title>
</head>
<body>
    <h1>Testing Alfalyzer API</h1>
    <button onclick="testAPI()">Test AAPL Quote</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Loading...';
            
            try {
                // Test the API endpoint
                const response = await fetch('https://alfalyzer.vercel.app/api/v1/stock/AAPL/quote');
                const data = await response.json();
                
                resultEl.textContent = JSON.stringify(data, null, 2);
                
                if (data.success && data.data) {
                    alert(`AAPL Price: $${data.data.price} (${data.data.changePercent}%)`);
                }
            } catch (error) {
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
