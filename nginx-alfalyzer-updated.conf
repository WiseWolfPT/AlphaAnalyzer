server {
    listen 80;
    server_name 128.140.45.28 128.140.45.28.sslip.io;
    return 301 https://128.140.45.28.sslip.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 128.140.45.28.sslip.io;

    ssl_certificate /etc/letsencrypt/live/128.140.45.28.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/128.140.45.28.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root "/home/teste 1/dist/public";
    index index.html;

    access_log /var/log/nginx/alfalyzer.access.log;
    error_log /var/log/nginx/alfalyzer.error.log;

    # CRITICAL: Force browser to always check for new index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # For root path, serve index.html with no-cache
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files /index.html =404;
    }

    # For all other paths (React Router), serve index.html with no-cache
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Assets with hash in filename - cache forever (immutable)
    location ~* "\-[a-zA-Z0-9]{6,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        access_log off;
    }

    # Regular assets without hash - moderate cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    # API proxy with proper headers
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        
        # Pass through authorization headers
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        
        # Ensure no caching for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        access_log off;
    }
}